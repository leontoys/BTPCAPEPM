<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPM Project | Home</title>
    <style>
        :root {
            --sap-blue: #0070f3;
            --bg-color: #f4f7f9;
            --text-color: #333;
        }
        body {
            font-family: "72", "72full", Arial, Helvetica, sans-serif; /* SAP standard-ish font */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            border-top: 5px solid var(--sap-blue);
        }
        h1 { margin-top: 0; color: var(--sap-blue); font-size: 2rem; }
        p { font-size: 1.1rem; color: #666; }
        .badge {
            display: inline-block;
            background: #e1f0ff;
            color: var(--sap-blue);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">SAP Cloud Application Programming Model</div>
        <h1>Welcome to My CAPM App</h1>
        <p>Your development environment is up and running. This is a static entry point located in the <code>/app</code> folder.</p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 2rem 0;">
        
        <div class="footer">
            Built with Node.js & Core Data Services (CDS)
        </div>
    </div>

</body>
</html>
